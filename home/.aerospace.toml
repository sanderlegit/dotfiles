# ctrl-shift-i = 'workspace I'
# ctrl-shift-m = 'workspace M'
# ctrl-shift-n = 'workspace N'
# ctrl-shift-o = 'workspace O'
# ctrl-shift-p = 'workspace P'
ctrl-shift-q = 'workspace Q'
ctrl-shift-r = 'workspace R'
ctrl-shift-s = 'workspace S'
