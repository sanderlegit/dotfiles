cmd-h = []     # Disable "hide application"
cmd-alt-h = [] # Disable "hide others"

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-shift-v = 'layout tiles horizontal'
ctrl-cmd-shift-v = 'layout tiles vertical'
ctrl-shift-c = 'layout accordion horizontal'
ctrl-cmd-shift-c = 'layout accordion vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
# ctrl-shift-h = 'focus left'
# ctrl-shift-j = 'focus down'
# ctrl-shift-k = 'focus up'
# ctrl-shift-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
ctrl-shift-cmd-h = 'move left'
ctrl-shift-cmd-j = 'move down'
ctrl-shift-cmd-k = 'move up'
ctrl-shift-cmd-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
ctrl-shift-cmd-minus = 'resize smart -50'
ctrl-shift-cmd-equal = 'resize smart +50'

cmd-ctrl-b = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
cmd-ctrl-shift-b = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout


# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
# alt-shift-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
ctrl-shift-space = 'move-workspace-to-monitor --wrap-around next'
# Swap workspaces with monitor to the right
# alt-tab = [
# 'move-workspace-to-monitor next',
# 'workspace-back-and-forth',
# 'move-workspace-to-monitor prev',
# ]


# See: https://nikitabobko.github.io/AeroSpace/commands#mode
# ctrl-shift-semicolon = 'mode service'
ctrl-shift-semicolon = 'reload-config'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
